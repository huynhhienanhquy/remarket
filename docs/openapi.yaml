components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CategoryId: { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  requestBodies:
    RegisterBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } }
    LoginBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } }
    TokenBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/TokenInput' } } }
    EmailBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/EmailInput' } } }
    ResendVerificationBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ResendVerificationInput' } } }
    ResetPasswordBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordInput' } } }
    ProfileBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } } }
    AvatarBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/AvatarInput' } } }
    ProductCreateBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ProductCreateInput' } } }
    ProductUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ProductUpdateInput' } } }
    CartItemBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CartItemInput' } } }
    CheckoutBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutInput' } } }
    OrderActionBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OrderActionInput' } } }
    ReviewBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ReviewInput' } } }
    OpenConversationBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/OpenConversationInput' } } }
    SendMessageBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SendMessageInput' } } }
    MarkReadBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/MarkReadInput' } } }
    ReportBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ReportInput' } } }
    SupportTicketBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SupportTicketInput' } } }
    SupportReplyBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/SupportReplyInput' } } }
    ReasonBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ReasonInput' } } }
    CategoryCreateBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CategoryCreateInput' } } }
    CategoryUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/CategoryUpdateInput' } } }
    ReportResolutionBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ReportResolutionInput' } } }
    ReportRejectionBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/ReportRejectionInput' } } }
    AdminTicketUpdateBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/AdminTicketUpdateInput' } } }
    AdminOrderCancelBody:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrderCancelInput' } } }
    AdminProductVersionBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminProductVersionInput' }
    AdminProductRejectBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminProductRejectInput' }
    AdminProductBlockBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminProductBlockInput' }
  responses:
    EmailVerificationSuccess:
      description: Own request or approved request; nullable only for accounts without a request.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - { type: object, properties: { data: { allOf: [{ $ref: '#/components/schemas/EmailVerificationRequest' }], nullable: true } } }
    EmailVerificationListSuccess:
      description: Paginated requests available only to ACTIVE admins.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - { type: object, properties: { data: { type: object, required: [items, meta], properties: { items: { type: array, items: { $ref: '#/components/schemas/EmailVerificationRequest' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    RegisterSuccess:
      description: Account created; email verification is pending
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, required: [pending_verification, email], additionalProperties: false, properties: { pending_verification: { type: boolean, enum: [true] }, email: { type: string, format: email } } } } }] } } }
    AccessTokenSuccess:
      description: Access token issued; refresh token is set in an HttpOnly cookie
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, required: [access_token], additionalProperties: false, properties: { access_token: { type: string } } } } }] } } }
    LoginSuccess:
      description: Access token and already-validated identity, avoiding another /auth/me request
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, required: [access_token, user], additionalProperties: false, properties: { access_token: { type: string }, user: { $ref: '#/components/schemas/SessionUser' } } } } }] } } }
    BootstrapSuccess:
      description: Trusted-origin cookie discovery and rotation; anonymous or expired sessions return null. Database failures remain errors.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [user, access_token]
                    properties:
                      user:
                        nullable: true
                        allOf: [{ $ref: '#/components/schemas/SessionUser' }]
                      access_token: { type: string, nullable: true }
    SessionUserSuccess:
      description: Current user
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SessionUser' } } }] } } }
    AckSuccess:
      description: Operation acknowledged
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, required: [ok], additionalProperties: false, properties: { ok: { type: boolean, enum: [true] } } } } }] } } }
    AcceptedSuccess:
      description: Request accepted without revealing account existence
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, required: [accepted], additionalProperties: false, properties: { accepted: { type: boolean, enum: [true] } } } } }] } } }
    VerificationResendSuccess:
      description: Verification request accepted, or throttled with retry information
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, properties: { retry_after: { type: integer, minimum: 1 } }, additionalProperties: false } } }] } } }
    CategoryTreeSuccess:
      description: Category tree
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CategoryNode' } } } }] } } }
    CategorySuccess:
