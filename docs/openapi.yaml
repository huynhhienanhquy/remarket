openapi: 3.0.3
info:
  title: ReMarket API
  version: 1.0.0
  description: |
    REST contract for the ReMarket marketplace. Monetary values are decimal
    strings in VND and timestamps are ISO-8601 UTC strings. Mutating order and
    product operations use optimistic versions. Checkout requires an
    Idempotency-Key header and replays the original result for the same payload.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Marketplace
  - name: Orders
  - name: Chat
  - name: Trust
  - name: Admin
x-error-profiles:
  public-validation: &PublicValidationErrors [VALIDATION_ERROR, RATE_LIMITED, INTERNAL]
  public-lookup: &PublicLookupErrors [VALIDATION_ERROR, NOT_FOUND, RATE_LIMITED, INTERNAL]
  session-read: &SessionReadErrors [VALIDATION_ERROR, UNAUTHORIZED, SESSION_EXPIRED, NOT_FOUND, RATE_LIMITED, INTERNAL]
  active-read: &ActiveReadErrors [VALIDATION_ERROR, UNAUTHORIZED, SESSION_EXPIRED, ACCOUNT_LOCKED, NOT_FOUND, RATE_LIMITED, INTERNAL]
  restricted-mutation: &RestrictedMutationErrors [VALIDATION_ERROR, UNAUTHORIZED, SESSION_EXPIRED, NOT_FOUND, INVALID_ORDER_TRANSITION, RETRY_LATER, RATE_LIMITED, INTERNAL]
  active-mutation: &ActiveMutationErrors [VALIDATION_ERROR, UNAUTHORIZED, SESSION_EXPIRED, FORBIDDEN, EMAIL_NOT_VERIFIED, ACCOUNT_LOCKED, NOT_FOUND, INVALID_ORDER_TRANSITION, VERSION_CONFLICT, RETRY_LATER, RATE_LIMITED, INTERNAL]
  admin-operation: &AdminOperationErrors [VALIDATION_ERROR, UNAUTHORIZED, SESSION_EXPIRED, FORBIDDEN, ACCOUNT_LOCKED, NOT_FOUND, INVALID_ORDER_TRANSITION, VERSION_CONFLICT, RETRY_LATER, RATE_LIMITED, INTERNAL]
x-operation-error-codes:
  register: *PublicValidationErrors
  login: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, RETRY_LATER, RATE_LIMITED, INTERNAL]
  bootstrapSession: [FORBIDDEN, RETRY_LATER, RATE_LIMITED, INTERNAL]
  refreshSession: [UNAUTHORIZED, FORBIDDEN, SESSION_EXPIRED, RETRY_LATER, RATE_LIMITED, INTERNAL]
  getSession: *SessionReadErrors
  logout: *SessionReadErrors
  logoutAll: *SessionReadErrors
  verifyEmail: [VALIDATION_ERROR, FORBIDDEN, ACCOUNT_LOCKED, NOT_FOUND, RATE_LIMITED, INTERNAL]
  getEmailVerificationRequest: *SessionReadErrors
  requestEmailVerification: *ActiveMutationErrors
  adminEmailVerifications: *AdminOperationErrors
  adminApproveEmailVerification: *AdminOperationErrors
  resendVerification: *PublicValidationErrors
  forgotPassword: *PublicValidationErrors
  resetPassword: *PublicValidationErrors
  updateProfile: *ActiveMutationErrors
  updateAvatar: *ActiveMutationErrors
  categoryTree: *PublicValidationErrors
  listProvinces: *PublicValidationErrors
  searchProducts: *PublicValidationErrors
  createProduct: *ActiveMutationErrors
  getProduct: *PublicLookupErrors
  updateProduct: *ActiveMutationErrors
  deleteProduct: *ActiveMutationErrors
  submitProduct: *ActiveMutationErrors
  hideProduct: *ActiveMutationErrors
  listOwnProducts: *ActiveMutationErrors
  uploadImage: *ActiveMutationErrors
  getUpload: *PublicLookupErrors
  listFavorites: *ActiveMutationErrors
  addFavorite: *ActiveMutationErrors
  removeFavorite: *ActiveMutationErrors
  getCart: *ActiveMutationErrors
  addCartItem: *ActiveMutationErrors
  removeCartItem: *ActiveMutationErrors
  checkout: [VALIDATION_ERROR, UNAUTHORIZED, SESSION_EXPIRED, EMAIL_NOT_VERIFIED, ACCOUNT_LOCKED, PRODUCT_NOT_AVAILABLE, PRICE_CHANGED, IDEMPOTENCY_CONFLICT, RETRY_LATER, RATE_LIMITED, INTERNAL]
  listOrders: *SessionReadErrors
  getOrder: *SessionReadErrors
  actOnOrder: *ActiveMutationErrors
  createReview: [VALIDATION_ERROR, UNAUTHORIZED, SESSION_EXPIRED, FORBIDDEN, EMAIL_NOT_VERIFIED, ACCOUNT_LOCKED, NOT_FOUND, REVIEW_NOT_ALLOWED, RETRY_LATER, RATE_LIMITED, INTERNAL]
  listConversations: *ActiveReadErrors
  getConversation: *ActiveReadErrors
  openConversation: *ActiveMutationErrors
  listMessages: *ActiveReadErrors
  sendMessage: *ActiveMutationErrors
  markConversationRead: *ActiveReadErrors
  getPublicProfile: *PublicLookupErrors
  getPublicProducts: *PublicLookupErrors
  listPublicReviews: *PublicLookupErrors
  createReport: *ActiveMutationErrors
  listOwnReports: *SessionReadErrors
  listNotifications: *SessionReadErrors
  unreadNotificationCount: *SessionReadErrors
  readNotification: *RestrictedMutationErrors
  readAllNotifications: *RestrictedMutationErrors
  listSupportTickets: *SessionReadErrors
  createSupportTicket: *RestrictedMutationErrors
  getSupportTicket: *SessionReadErrors
  replySupportTicket: *RestrictedMutationErrors
  closeSupportTicket: *RestrictedMutationErrors
  adminDashboard: *AdminOperationErrors
  adminUsers: *AdminOperationErrors
  adminLockUser: *AdminOperationErrors
  adminUnlockUser: *AdminOperationErrors
  adminUserDetail: *AdminOperationErrors
  adminProducts: *AdminOperationErrors
  adminApproveProduct: *AdminOperationErrors
  adminRejectProduct: *AdminOperationErrors
  adminBlockProduct: *AdminOperationErrors
  adminUnblockProduct: *AdminOperationErrors
  adminCategories: *AdminOperationErrors
  adminCategoryTree: *AdminOperationErrors
  adminCreateCategory: *AdminOperationErrors
  adminUpdateCategory: *AdminOperationErrors
  adminReports: *AdminOperationErrors
  adminResolveReport: *AdminOperationErrors
  adminRejectReport: *AdminOperationErrors
  adminReviews: *AdminOperationErrors
  adminHideReview: *AdminOperationErrors
  adminTickets: *AdminOperationErrors
  adminTicketDetail: *AdminOperationErrors
  adminUpdateTicket: *AdminOperationErrors
  adminReplyTicket: *AdminOperationErrors
  adminAudit: *AdminOperationErrors
  adminCancelOrder: *AdminOperationErrors
paths:
  /auth/register:
    post: { tags: [Auth], operationId: register, requestBody: { $ref: '#/components/requestBodies/RegisterBody' }, responses: { '201': { $ref: '#/components/responses/RegisterSuccess' }, '422': { $ref: '#/components/responses/Error' } } }
  /auth/login:
    post: { tags: [Auth], operationId: login, requestBody: { $ref: '#/components/requestBodies/LoginBody' }, responses: { '200': { $ref: '#/components/responses/LoginSuccess' }, '401': { $ref: '#/components/responses/Error' } } }
  /auth/refresh:
    post: { tags: [Auth], operationId: refreshSession, responses: { '200': { $ref: '#/components/responses/AccessTokenSuccess' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } } }
  /auth/bootstrap:
    post: { tags: [Auth], operationId: bootstrapSession, responses: { '200': { $ref: '#/components/responses/BootstrapSuccess' }, '403': { $ref: '#/components/responses/Error' } } }
  /auth/me:
    get: { tags: [Auth], operationId: getSession, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/SessionUserSuccess' }, '401': { $ref: '#/components/responses/Error' } } }
  /auth/logout:
    post: { tags: [Auth], operationId: logout, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/AckSuccess' } } }
  /auth/logout-all:
    post: { tags: [Auth], operationId: logoutAll, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/AckSuccess' } } }
  /auth/verify-email:
    post: { tags: [Auth], operationId: verifyEmail, description: Consumes a legacy one-time mailbox token and submits an admin approval request. Opens a session but does NOT mark email verified., requestBody: { $ref: '#/components/requestBodies/TokenBody' }, responses: { '200': { $ref: '#/components/responses/AccessTokenSuccess' }, '422': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } } }
  /auth/email-verification-request:
    get:
      tags: [Auth]
      operationId: getEmailVerificationRequest
      security: [{ bearerAuth: [] }]
      description: Own request only; null when no request exists. Never accepts a target email or user ID.
      responses:
        '200': { $ref: '#/components/responses/EmailVerificationSuccess' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      security: [{ bearerAuth: [] }]
      description: ACTIVE account submits its immutable email for admin approval. Idempotent retries, no self-verification. Limit 3 per account per hour; trusted Origin required in production. Frontend returns home on success.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, example: {} } } } }
      responses:
        '200': { $ref: '#/components/responses/EmailVerificationSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /admin/email-verifications:
    get:
      tags: [Admin]
      operationId: adminEmailVerifications
      security: [{ bearerAuth: [] }]
      description: ACTIVE ADMIN only. Pending requests by default, including users who became locked after submitting.
      parameters: [{ name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, ALL], default: PENDING } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { $ref: '#/components/responses/EmailVerificationListSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/email-verifications/{id}/approve:
    post:
      tags: [Admin]
      operationId: adminApproveEmailVerification
      security: [{ bearerAuth: [] }]
      description: ACTIVE ADMIN approves an existing request. Idempotent under concurrency. Updates only emailVerifiedAt; does not unlock accounts or grant roles. Approval, audit, notification and realtime outbox commit atomically.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, example: {} } } } }
      responses:
        '200': { $ref: '#/components/responses/EmailVerificationSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /auth/resend-verification:
    post: { tags: [Auth], operationId: resendVerification, requestBody: { $ref: '#/components/requestBodies/ResendVerificationBody' }, responses: { '200': { $ref: '#/components/responses/VerificationResendSuccess' } } }
  /auth/forgot-password:
    post: { tags: [Auth], operationId: forgotPassword, requestBody: { $ref: '#/components/requestBodies/EmailBody' }, responses: { '200': { $ref: '#/components/responses/AcceptedSuccess' } } }
  /auth/reset-password:
    post: { tags: [Auth], operationId: resetPassword, requestBody: { $ref: '#/components/requestBodies/ResetPasswordBody' }, responses: { '200': { $ref: '#/components/responses/AcceptedSuccess' }, '422': { $ref: '#/components/responses/Error' } } }
  /auth/profile:
    patch: { tags: [Auth], operationId: updateProfile, security: [{ bearerAuth: [] }], requestBody: { $ref: '#/components/requestBodies/ProfileBody' }, responses: { '200': { $ref: '#/components/responses/SessionUserSuccess' } } }
  /auth/avatar:
    patch: { tags: [Auth], operationId: updateAvatar, security: [{ bearerAuth: [] }], requestBody: { $ref: '#/components/requestBodies/AvatarBody' }, responses: { '200': { $ref: '#/components/responses/SessionUserSuccess' } } }

  /categories:
    get: { tags: [Marketplace], operationId: categoryTree, responses: { '200': { $ref: '#/components/responses/CategoryTreeSuccess' } } }
  /provinces:
    get: { tags: [Marketplace], operationId: listProvinces, responses: { '200': { $ref: '#/components/responses/ProvinceListSuccess' } } }
  /products:
    get:
      tags: [Marketplace]
      operationId: searchProducts
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category_id, in: query, schema: { type: string } }
        - { name: province_code, in: query, schema: { type: string } }
        - { name: min_price, in: query, schema: { $ref: '#/components/schemas/MoneyString' } }
        - { name: max_price, in: query, schema: { $ref: '#/components/schemas/MoneyString' } }
        - { name: condition, in: query, schema: { type: string, enum: [LIKE_NEW, GOOD, FAIR, HEAVILY_USED] } }
        - { name: delivery_method, in: query, schema: { type: string, enum: [COD, MEETUP, BOTH] } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc] } }
        - { $ref: '#/components/parameters/PageSize' }
      responses: { '200': { $ref: '#/components/responses/ProductListSuccess' } }
    post: { tags: [Marketplace], operationId: createProduct, security: [{ bearerAuth: [] }], requestBody: { $ref: '#/components/requestBodies/ProductCreateBody' }, responses: { '201': { $ref: '#/components/responses/ProductDetailSuccess' }, '422': { $ref: '#/components/responses/Error' } } }
  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { tags: [Marketplace], operationId: getProduct, responses: { '200': { $ref: '#/components/responses/ProductDetailSuccess' }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Marketplace], operationId: updateProduct, security: [{ bearerAuth: [] }], requestBody: { $ref: '#/components/requestBodies/ProductUpdateBody' }, responses: { '200': { $ref: '#/components/responses/ProductDetailSuccess' }, '409': { $ref: '#/components/responses/Error' } } }
    delete: { tags: [Marketplace], operationId: deleteProduct, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/IdSuccess' } } }
  /products/{id}/submit:
    post: { tags: [Marketplace], operationId: submitProduct, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/ProductDetailSuccess' } } }
  /products/{id}/hide:
    post: { tags: [Marketplace], operationId: hideProduct, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/ProductDetailSuccess' } } }
  /account/products:
    get: { tags: [Marketplace], operationId: listOwnProducts, security: [{ bearerAuth: [] }], parameters: [{ name: status, in: query, schema: { type: string, enum: [PENDING, ACTIVE, REJECTED, RESERVED, SOLD, INACTIVE] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/OwnProductListSuccess' } } }
  /uploads:
    post:
      tags: [Marketplace]
      operationId: uploadImage
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, format: binary }
                purpose: { type: string, enum: [product, avatar] }
      responses: { '201': { $ref: '#/components/responses/UploadSuccess' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /uploads/{filename}:
    get: { tags: [Marketplace], operationId: getUpload, parameters: [{ name: filename, in: path, required: true, schema: { type: string } }], responses: { '200': { description: Local private image bytes }, '302': { description: Redirect to a five-minute Supabase signed URL }, '404': { $ref: '#/components/responses/Error' } } }
  /favorites:
    get: { tags: [Marketplace], operationId: listFavorites, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/ProductListSuccess' } } }
  /favorites/{productId}:
    parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
    put: { tags: [Marketplace], operationId: addFavorite, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/FavoriteSuccess' } } }
    delete: { tags: [Marketplace], operationId: removeFavorite, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/FavoriteSuccess' } } }
  /cart:
    get: { tags: [Marketplace], operationId: getCart, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/CartSuccess' } } }
  /cart/items:
    post: { tags: [Marketplace], operationId: addCartItem, security: [{ bearerAuth: [] }], requestBody: { $ref: '#/components/requestBodies/CartItemBody' }, responses: { '200': { $ref: '#/components/responses/CartSuccess' } } }
  /cart/items/{productId}:
    delete: { tags: [Marketplace], operationId: removeCartItem, security: [{ bearerAuth: [] }], parameters: [{ name: productId, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/CartSuccess' } } }

  /checkout:
    post:
      tags: [Orders]
      operationId: checkout
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 200 }
          description: Same key and canonical payload replay the original order group; another payload returns IDEMPOTENCY_CONFLICT.
      requestBody: { $ref: '#/components/requestBodies/CheckoutBody' }
      responses: { '201': { $ref: '#/components/responses/CheckoutSuccess' }, '409': { $ref: '#/components/responses/Error' } }
  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [buyer, seller] } }
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses: { '200': { $ref: '#/components/responses/OrderListSuccess' } }
  /orders/{id}:
    get: { tags: [Orders], operationId: getOrder, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/OrderDetailSuccess' }, '404': { $ref: '#/components/responses/Error' } } }
  /orders/{id}/actions:
    post:
      tags: [Orders]
      operationId: actOnOrder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/OrderActionBody' }
      responses: { '200': { $ref: '#/components/responses/OrderDetailSuccess' }, '409': { $ref: '#/components/responses/Error' } }
  /orders/{orderId}/reviews:
    post: { tags: [Trust], operationId: createReview, security: [{ bearerAuth: [] }], parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }], requestBody: { $ref: '#/components/requestBodies/ReviewBody' }, responses: { '201': { $ref: '#/components/responses/ReviewSuccess' }, '409': { $ref: '#/components/responses/Error' } } }

  /conversations:
    get: { tags: [Chat], operationId: listConversations, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/ConversationListSuccess' } } }
    post: { tags: [Chat], operationId: openConversation, security: [{ bearerAuth: [] }], requestBody: { $ref: '#/components/requestBodies/OpenConversationBody' }, responses: { '200': { $ref: '#/components/responses/ConversationSuccess' }, '201': { $ref: '#/components/responses/ConversationSuccess' } } }
  /conversations/{conversationId}:
    get: { tags: [Chat], operationId: getConversation, security: [{ bearerAuth: [] }], parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { $ref: '#/components/responses/ConversationSuccess' }, '404': { $ref: '#/components/responses/Error' } } }
  /conversations/{conversationId}/messages:
    parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { tags: [Chat], operationId: listMessages, security: [{ bearerAuth: [] }], parameters: [{ name: cursor, in: query, schema: { type: string, maxLength: 1024 } }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/MessagePageSuccess' } } }
    post: { tags: [Chat], operationId: sendMessage, security: [{ bearerAuth: [] }], requestBody: { $ref: '#/components/requestBodies/SendMessageBody' }, responses: { '200': { $ref: '#/components/responses/MessageSuccess' }, '201': { $ref: '#/components/responses/MessageSuccess' } } }
  /conversations/{conversationId}/read:
    post: { tags: [Chat], operationId: markConversationRead, security: [{ bearerAuth: [] }], parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }], requestBody: { $ref: '#/components/requestBodies/MarkReadBody' }, responses: { '200': { $ref: '#/components/responses/MarkReadSuccess' } } }

  /users/{id}:
    get: { tags: [Marketplace], operationId: getPublicProfile, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/PublicProfileSuccess' } } }
  /users/{id}/products:
    get: { tags: [Marketplace], operationId: getPublicProducts, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/ProductListSuccess' } } }
  /users/{id}/reviews:
    get: { tags: [Trust], operationId: listPublicReviews, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/ReviewListSuccess' } } }
  /reports:
    post: { tags: [Trust], operationId: createReport, security: [{ bearerAuth: [] }], requestBody: { $ref: '#/components/requestBodies/ReportBody' }, responses: { '201': { $ref: '#/components/responses/ReportSuccess' }, '409': { $ref: '#/components/responses/Error' } } }
  /reports/mine:
    get: { tags: [Trust], operationId: listOwnReports, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/ReportListSuccess' } } }
  /notifications:
    get: { tags: [Trust], operationId: listNotifications, security: [{ bearerAuth: [] }], parameters: [{ name: type, in: query, schema: { $ref: '#/components/schemas/NotificationType' } }, { name: unread, in: query, schema: { type: boolean } }, { name: unread_only, in: query, schema: { type: boolean } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/NotificationListSuccess' } } }
  /notifications/unread-count:
    get: { tags: [Trust], operationId: unreadNotificationCount, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/CountSuccess' } } }
  /notifications/{id}/read:
    post: { tags: [Trust], operationId: readNotification, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/MutationCountSuccess' } } }
  /notifications/read-all:
    post: { tags: [Trust], operationId: readAllNotifications, security: [{ bearerAuth: [] }], responses: { '200': { $ref: '#/components/responses/MutationCountSuccess' } } }
  /support/tickets:
    get: { tags: [Trust], operationId: listSupportTickets, security: [{ bearerAuth: [] }], parameters: [{ name: status, in: query, schema: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] } }, { name: type, in: query, schema: { type: string, enum: [ACCOUNT, ORDER_PROBLEM, PRODUCT, OTHER] } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/SupportTicketListSuccess' } } }
    post: { tags: [Trust], operationId: createSupportTicket, security: [{ bearerAuth: [] }], requestBody: { $ref: '#/components/requestBodies/SupportTicketBody' }, responses: { '201': { $ref: '#/components/responses/SupportTicketSuccess' } } }
  /support/tickets/{id}:
    get: { tags: [Trust], operationId: getSupportTicket, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/SupportTicketSuccess' } } }
  /support/tickets/{id}/messages:
    post: { tags: [Trust], operationId: replySupportTicket, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { $ref: '#/components/requestBodies/SupportReplyBody' }, responses: { '200': { $ref: '#/components/responses/SupportTicketSuccess' } } }
  /support/tickets/{id}/close:
    post: { tags: [Trust], operationId: closeSupportTicket, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/SupportTicketSuccess' }, '409': { $ref: '#/components/responses/Error' } } }

  /admin/dashboard:
