    AdminUserListSuccess:
      description: Paginated users
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdminUserListData' } } }] } } }
    AdminUserSuccess:
      description: Admin user view
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdminUser' } } }] } } }
    AdminProductListSuccess:
      description: Paginated admin products
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdminProductListData' } } }] } } }
    AdminProductSuccess:
      description: Admin product view
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdminProduct' } } }] } } }
    AdminReportListSuccess:
      description: Paginated admin reports
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdminReportListData' } } }] } } }
    AdminReportSuccess:
      description: Admin report view
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdminReport' } } }] } } }
    AdminReviewListSuccess:
      description: Paginated admin reviews
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdminReviewListData' } } }] } } }
    AdminReviewSuccess:
      description: Admin review view
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdminReview' } } }] } } }
    AdminSupportTicketListSuccess:
      description: Paginated admin support tickets
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdminSupportTicketListData' } } }] } } }
    AdminSupportTicketSuccess:
      description: Admin support ticket detail
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AdminSupportTicketDetail' } } }] } } }
    AuditLogListSuccess:
      description: Paginated audit log
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AuditLogListData' } } }] } } }
    AdminOrderCancelSuccess:
      description: Order cancelled by an administrator
      content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, required: [id, status, version], additionalProperties: false, properties: { id: { type: string, format: uuid }, status: { type: string, enum: [CANCELLED] }, version: { type: integer, minimum: 2 } } } } }] } } }
    Error:
      description: Business or validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    EmailVerificationRequest:
      type: object
      required: [id, user, status, requested_at, approved_at]
      properties:
        id: { type: string, format: uuid }
        user:
          type: object
          required: [id, full_name, email, status]
          properties:
            id: { type: string, format: uuid }
            full_name: { type: string }
            email: { type: string, format: email }
            status: { type: string, enum: [ACTIVE, LOCKED] }
        status: { type: string, enum: [PENDING, APPROVED] }
        requested_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time, nullable: true }
    RegisterInput:
      type: object
      required: [full_name, email, password, confirm_password, phone]
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1, maxLength: 100, example: Nguyễn Văn An }
        email: { type: string, format: email, maxLength: 254, example: an@example.com }
        password: { type: string, minLength: 12, maxLength: 72, format: password, writeOnly: true, example: MatKhauRatManh123! }
        confirm_password: { type: string, minLength: 12, maxLength: 72, format: password, writeOnly: true, example: MatKhauRatManh123! }
        phone: { type: string, pattern: '^\d{9,11}$', example: '0900000000' }
    LoginInput:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254, example: an@example.com }
        password: { type: string, maxLength: 72, format: password, writeOnly: true }
    TokenInput:
      type: object
      required: [token]
      additionalProperties: false
      properties: { token: { type: string, minLength: 1, maxLength: 200, writeOnly: true } }
    EmailInput:
      type: object
      required: [email]
      additionalProperties: false
      properties: { email: { type: string, format: email, maxLength: 254, example: an@example.com } }
    ResendVerificationInput:
      type: object
      required: [email]
      additionalProperties: false
      properties: { email: { type: string, format: email, maxLength: 254, example: an@example.com } }
    ResetPasswordInput:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1, maxLength: 200, writeOnly: true }
        password: { type: string, minLength: 12, maxLength: 72, format: password, writeOnly: true }
    ProfileInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: string, nullable: true, pattern: '^\d{9,11}$' }
        province_code: { type: string, nullable: true, maxLength: 20 }
        default_address: { type: string, nullable: true, maxLength: 300 }
    AvatarInput:
      type: object
      required: [storage_path]
      additionalProperties: false
      properties: { storage_path: { type: string, minLength: 1, maxLength: 300, example: users/00000000-0000-0000-0000-000000000001/avatar/avatar.webp } }
    ProductImageInput:
      type: object
      required: [url, storage_path, sort_order]
      additionalProperties: false
      properties:
        url: { type: string, minLength: 1, example: /api/v1/uploads/image.webp }
        storage_path: { type: string, maxLength: 300, example: users/00000000-0000-0000-0000-000000000001/product/image.webp }
        sort_order: { type: integer, minimum: 0, maximum: 7 }
    ProductCreateInput:
      type: object
      required: [title, description, category_id, price, condition, province_code, delivery_method, shipping_fee, images]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 5, maxLength: 150, example: Máy ảnh Fujifilm còn đẹp }
        description: { type: string, minLength: 20, maxLength: 5000, example: Máy hoạt động tốt, đầy đủ pin và sạc chính hãng. }
        category_id: { type: string, minLength: 1, maxLength: 64 }
        price: { $ref: '#/components/schemas/PriceString' }
        condition: { type: string, enum: [LIKE_NEW, GOOD, FAIR, HEAVILY_USED] }
        usage_months: { type: integer, nullable: true, minimum: 0, maximum: 1200 }
        province_code: { type: string, minLength: 1, maxLength: 20 }
        delivery_method: { type: string, enum: [COD, MEETUP, BOTH] }
        shipping_fee: { $ref: '#/components/schemas/ShippingFeeString' }
        images: { type: array, minItems: 1, maxItems: 8, items: { $ref: '#/components/schemas/ProductImageInput' } }
    ProductUpdateInput:
      type: object
      required: [title, description, category_id, price, condition, province_code, delivery_method, shipping_fee, expected_version]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 5, maxLength: 150 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        category_id: { type: string, minLength: 1, maxLength: 64 }
        price: { $ref: '#/components/schemas/PriceString' }
        condition: { type: string, enum: [LIKE_NEW, GOOD, FAIR, HEAVILY_USED] }
        usage_months: { type: integer, nullable: true, minimum: 0, maximum: 1200 }
        province_code: { type: string, minLength: 1, maxLength: 20 }
        delivery_method: { type: string, enum: [COD, MEETUP, BOTH] }
        shipping_fee: { $ref: '#/components/schemas/ShippingFeeString' }
        images: { type: array, minItems: 1, maxItems: 8, items: { $ref: '#/components/schemas/ProductImageInput' } }
        expected_version: { type: integer, minimum: 1 }
    CartItemInput:
      type: object
      required: [product_id]
      additionalProperties: false
      properties: { product_id: { type: string, format: uuid } }
    CheckoutItemInput:
      type: object
      required: [product_id, expected_price]
      additionalProperties: false
      properties:
        product_id: { type: string, format: uuid }
        expected_price: { $ref: '#/components/schemas/PriceString' }
    CheckoutDeliveryInput:
      type: object
      required: [seller_id, method, recipient_name, recipient_phone, delivery_address, expected_shipping_fee]
      additionalProperties: false
      properties:
        seller_id: { type: string, format: uuid }
        method: { type: string, enum: [COD, MEETUP] }
        recipient_name: { type: string, minLength: 1, maxLength: 100, example: Nguyễn Văn An }
        recipient_phone: { type: string, pattern: '^\d{9,11}$', example: '0900000000' }
        delivery_address: { type: string, minLength: 1, maxLength: 300, example: 12 Nguyễn Huệ, Quận 1 }
        expected_shipping_fee: { $ref: '#/components/schemas/ShippingFeeString' }
    CheckoutInput:
      type: object
      required: [items, deliveries]
      additionalProperties: false
      properties:
        items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/CheckoutItemInput' } }
        deliveries: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/CheckoutDeliveryInput' } }
    OrderActionInput:
      type: object
      required: [action, expected_version]
      additionalProperties: false
      properties:
        action: { type: string, enum: [confirm, cancel, ship, deliver, complete, support, chat] }
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500 }
        carrier: { type: string, maxLength: 100 }
        tracking_code: { type: string, maxLength: 100 }
        buyer_confirmed_received: { type: boolean }
        buyer_confirmed_paid: { type: boolean }
    ReviewInput:
      type: object
      required: [rating]
      additionalProperties: false
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true, maxLength: 1000 }
        expected_version: { type: integer, minimum: 1 }
    OpenConversationInput:
      type: object
      required: [product_id]
      additionalProperties: false
      properties: { product_id: { type: string, format: uuid } }
    SendMessageInput:
      type: object
      required: [content, client_message_id]
      additionalProperties: false
      properties:
        content: { type: string, minLength: 1, maxLength: 2000, example: Sản phẩm này còn không bạn? }
        client_message_id: { type: string, minLength: 1, maxLength: 100 }
    MarkReadInput:
      type: object
      required: [last_message_id]
      additionalProperties: false
      properties: { last_message_id: { type: string, format: uuid } }
    ReportInput:
      type: object
      required: [target_type, reason]
      additionalProperties: false
      properties:
        target_type: { type: string, enum: [product, user] }
        product_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        reason: { type: string, enum: [COUNTERFEIT, PROHIBITED, FRAUD, SPAM, HARASSMENT, INAPPROPRIATE, OTHER] }
        description: { type: string, maxLength: 2000 }
    SupportTicketInput:
      type: object
      required: [type, subject, message]
      additionalProperties: false
      properties:
        type: { type: string, enum: [ACCOUNT, ORDER_PROBLEM, PRODUCT, OTHER] }
        subject: { type: string, minLength: 5, maxLength: 150, example: Cần hỗ trợ đơn hàng }
        message: { type: string, minLength: 1, maxLength: 5000 }
        order_id: { type: string, format: uuid }
    SupportReplyInput:
      type: object
      required: [message]
      additionalProperties: false
      properties: { message: { type: string, minLength: 1, maxLength: 5000 } }
    ReasonInput:
      type: object
      required: [reason]
      additionalProperties: false
      properties: { reason: { type: string, minLength: 1, maxLength: 500 } }
    CategoryCreateInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, minLength: 1, maxLength: 120 }
        parent_id: { type: string, nullable: true, maxLength: 64 }
    CategoryUpdateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, minLength: 1, maxLength: 120 }
        parent_id: { type: string, nullable: true, maxLength: 64 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    ReportResolutionInput:
      type: object
      required: [resolution_note]
      additionalProperties: false
      properties:
        resolution_note: { type: string, minLength: 1, maxLength: 1000 }
        action: { type: string, enum: [block_product, lock_user, none], default: none }
    ReportRejectionInput:
      type: object
      required: [resolution_note]
      additionalProperties: false
      properties: { resolution_note: { type: string, minLength: 1, maxLength: 1000 } }
    AdminTicketUpdateInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        resolution_note: { type: string, maxLength: 2000 }
        assigned_admin_id: { type: string, nullable: true, maxLength: 64 }
        assign: { type: boolean }
    AdminOrderCancelInput:
      type: object
      required: [expected_version, reason]
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        ticket_id: { type: string, format: uuid }
        delivery_outcome: { type: string, enum: [NOT_DELIVERED, RETURNED] }
        payment_resolution: { type: string, minLength: 1, maxLength: 1000 }
    AdminProductVersionInput:
      type: object
      required: [expected_version]
      additionalProperties: false
      properties: { expected_version: { type: integer, minimum: 1 } }
    AdminProductRejectInput:
      type: object
      required: [expected_version, reason]
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdminProductBlockInput:
      type: object
      required: [expected_version, reason]
      additionalProperties: false
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    MoneyString:
      type: string
      pattern: '^\d+$'
      example: '1100000'
    PriceString:
      allOf:
        - { $ref: '#/components/schemas/MoneyString' }
      description: Positive integer VND, maximum 1,000,000,000.
    ShippingFeeString:
      allOf:
        - { $ref: '#/components/schemas/MoneyString' }
      description: Non-negative integer VND, maximum 10,000,000.
    IsoDateTime: { type: string, format: date-time }
    UserRole: { type: string, enum: [USER, ADMIN] }
    UserStatus: { type: string, enum: [ACTIVE, LOCKED] }
    ProductStatus: { type: string, enum: [PENDING, ACTIVE, REJECTED, RESERVED, SOLD, INACTIVE] }
    Condition: { type: string, enum: [LIKE_NEW, GOOD, FAIR, HEAVILY_USED] }
    DeliveryMethod: { type: string, enum: [COD, MEETUP, BOTH] }
    OrderDeliveryMethod: { type: string, enum: [COD, MEETUP] }
    OrderStatus: { type: string, enum: [PENDING, CONFIRMED, SHIPPING, DELIVERED, COMPLETED, CANCELLED] }
    ReportReason: { type: string, enum: [COUNTERFEIT, PROHIBITED, FRAUD, SPAM, HARASSMENT, INAPPROPRIATE, OTHER] }
    ReportStatus: { type: string, enum: [PENDING, RESOLVED, REJECTED] }
    TicketType: { type: string, enum: [ACCOUNT, ORDER_PROBLEM, PRODUCT, OTHER] }
    TicketStatus: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
    PageMeta:
      type: object
      required: [page, page_size, total, total_pages]
      additionalProperties: false
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 1 }
    SessionUser:
      type: object
      required: [id, full_name, email, avatar_url, role, status, email_verified_at, phone, province_code, default_address, joined_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string, format: email }
        avatar_url: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        email_verified_at: { allOf: [{ $ref: '#/components/schemas/IsoDateTime' }], nullable: true }
        phone: { type: string, nullable: true }
        province_code: { type: string, nullable: true }
        default_address: { type: string, nullable: true }
        joined_at: { $ref: '#/components/schemas/IsoDateTime' }
    SellerSummary:
      type: object
      required: [id, name, avatar_url, province_code, province_label, joined_at, rating, review_count, completed_sales_count]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar_url: { type: string, nullable: true }
        province_code: { type: string, nullable: true }
        province_label: { type: string, nullable: true }
        joined_at: { $ref: '#/components/schemas/IsoDateTime' }
        rating: { type: number, nullable: true, minimum: 1, maximum: 5 }
        review_count: { type: integer, minimum: 0 }
        completed_sales_count: { type: integer, minimum: 0 }
    PublicProfile:
      type: object
      required: [seller]
      additionalProperties: false
      properties: { seller: { $ref: '#/components/schemas/SellerSummary' } }
    Province:
      type: object
      required: [code, name]
      additionalProperties: false
      properties: { code: { type: string }, name: { type: string } }
    CategoryNode:
      type: object
      required: [id, parent_id, name, slug, status]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        parent_id: { type: string, maxLength: 64, nullable: true }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        children: { type: array, items: { $ref: '#/components/schemas/CategoryNode' } }
    ProductImage:
      type: object
      required: [id, url, sort_order]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        storage_path: { type: string }
        sort_order: { type: integer, minimum: 0 }
    ProductCapabilities:
      type: object
      required: [can_buy, can_add_to_cart, can_chat, can_favorite, can_report, can_edit, can_manage, unavailable_reason]
      additionalProperties: false
      properties:
        can_buy: { type: boolean }
        can_add_to_cart: { type: boolean }
        can_chat: { type: boolean }
        can_favorite: { type: boolean }
        can_report: { type: boolean }
        can_edit: { type: boolean }
        can_manage: { type: boolean }
        unavailable_reason: { type: string, nullable: true }
    ProductListItem:
      type: object
      required: [id, title, price, image_url, condition, province_code, province_label, published_at, created_at, status, is_favorited, seller]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        price: { $ref: '#/components/schemas/MoneyString' }
        image_url: { type: string, nullable: true }
        condition: { $ref: '#/components/schemas/Condition' }
        province_code: { type: string }
        province_label: { type: string, nullable: true }
        published_at: { allOf: [{ $ref: '#/components/schemas/IsoDateTime' }], nullable: true }
        created_at: { $ref: '#/components/schemas/IsoDateTime' }
        status: { $ref: '#/components/schemas/ProductStatus' }
        is_favorited: { type: boolean }
        seller: { $ref: '#/components/schemas/SellerSummary' }
        is_blocked: { type: boolean }
        is_hidden: { type: boolean }
    ProductDetail:
      allOf:
        - { $ref: '#/components/schemas/ProductListItem' }
        - type: object
          required: [description, images, category_id, category_path, usage_months, delivery_method, shipping_fee, version, is_blocked, block_reason, rejection_reason, capabilities]
          properties:
            description: { type: string }
            images: { type: array, items: { $ref: '#/components/schemas/ProductImage' } }
            category_id: { type: string, minLength: 1, maxLength: 64 }
            category_path: { type: array, items: { type: string } }
            usage_months: { type: integer, nullable: true, minimum: 0 }
            delivery_method: { $ref: '#/components/schemas/DeliveryMethod' }
            shipping_fee: { $ref: '#/components/schemas/MoneyString' }
            version: { type: integer, minimum: 1 }
            is_blocked: { type: boolean }
            block_reason: { type: string, nullable: true }
            rejection_reason: { type: string, nullable: true }
            capabilities: { $ref: '#/components/schemas/ProductCapabilities' }
    OwnProduct:
      allOf:
        - { $ref: '#/components/schemas/ProductDetail' }
        - type: object
          required: [allowed_actions]
          properties:
            allowed_actions: { type: array, items: { type: string, enum: [edit, submit, resubmit, hide, delete, view] } }
    CartItem:
      type: object
      required: [product_id, title, price, image_url, condition, status, province_label, available, unavailable_reason]
      additionalProperties: false
      properties:
        product_id: { type: string, format: uuid }
        title: { type: string }
        price: { $ref: '#/components/schemas/MoneyString' }
        image_url: { type: string, nullable: true }
        condition: { $ref: '#/components/schemas/Condition' }
        status: { $ref: '#/components/schemas/ProductStatus' }
        province_label: { type: string, nullable: true }
        available: { type: boolean }
