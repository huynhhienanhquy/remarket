packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 reads workspace settings from this file, not package.json.
# esbuild needs its postinstall so vite/vitest can resolve the platform binary.
allowBuilds:
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  workerd: false
