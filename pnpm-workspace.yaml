packages:
  - "apps/*"
  - "packages/*"

# CLI 58.1.19 requires @expo/env 2.5.4, which is not published on npm yet.
overrides:
  'expo@58.0.22>@expo/cli': 58.1.18
  # Metro 0.87.3 references metro-file-map 0.87.3, which is not published yet.
  'metro@>=0.87.0 <0.88.0': 0.87.1
  'metro-config@>=0.87.0 <0.88.0': 0.87.1

# pnpm 11 reads workspace settings from this file, not package.json.
# esbuild needs its postinstall so vite/vitest can resolve the platform binary.
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  workerd: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/prebuild-config@57.0.19'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo@57.0.29
  - '@expo/ui@57.0.24'
  - expo-linking@57.0.13
  - expo-notifications@57.0.23
  - expo-router@57.0.27
  - '@expo/metro-runtime@57.0.17'
