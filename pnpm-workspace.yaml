packages:
  - "apps/*"
  - "packages/*"

overrides:
  # Security fixes for existing dependency lines, including Vitest's Vite peer.
  vite: 7.3.8
  'body-parser@1': 1.20.9
  'body-parser@2': 2.4.0
  'fast-uri@3': 3.1.9
  'ip-address@10': 10.7.4
  'node-forge@1': 1.4.3
  'postcss-selector-parser@6': 6.1.5
  'qs@6': 6.16.1

# pnpm 11 reads workspace settings from this file, not package.json.
# esbuild needs its postinstall so vite/vitest can resolve the platform binary.
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  workerd: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/prebuild-config@57.0.19'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo@57.0.29
  - '@expo/ui@57.0.24'
  - expo-linking@57.0.13
  - expo-notifications@57.0.23
  - expo-router@57.0.27
  - '@expo/metro-runtime@57.0.17'
