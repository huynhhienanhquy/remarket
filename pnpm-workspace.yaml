packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 reads workspace settings from this file, not package.json.
# esbuild needs its postinstall so vite/vitest can resolve the platform binary.
allowBuilds:
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  workerd: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/prebuild-config@57.0.19'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo@57.0.29
  - '@expo/ui@57.0.24'
  - expo-linking@57.0.13
  - expo-notifications@57.0.23
  - expo-router@57.0.27
  - '@expo/metro-runtime@57.0.17'
